<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script File Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .kontejner {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid #333;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #fff;
        }
        .napomena {
            background-color: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            color: #ffc107;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: left;
            line-height: 1.5;
        }
        .okvir-za-izbor {
            border: 2px dashed #007bff;
            padding: 40px 20px;
            border-radius: 5px;
            background-color: rgba(0, 123, 255, 0.05);
            cursor: pointer;
            transition: background 0.3s;
        }
        .okvir-za-izbor:hover {
            background-color: rgba(0, 123, 255, 0.1);
        }
        .gumb-izaberi {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        #file-upload {
            display: none;
        }
        #poruka-baza {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
        }
        #lista-za-skidanje {
            margin-top: 25px;
            width: 100%;
            text-align: left;
        }
        .stavka {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 5px solid #24a148;
            display: flex;
            flex-direction: column;
        }
        .stavka.greska {
            border-left: 5px solid #f85149;
        }
        .ime-skripte {
            font-size: 14px;
            margin-bottom: 10px;
            word-break: break-all;
        }
        .gumbi-kontejner {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .gumb-skini {
            display: inline-block;
            background-color: #24a148;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }
        .gumb-skini:hover {
            background-color: #1c7c37;
        }
        .gumb-video {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }
        .gumb-video:hover {
            background-color: #0056b3;
        }
        .greska-tekst {
            color: #f85149;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="kontejner" id="kontejner-za-stavke">
    <h1>Carlito Script File Converter (.txt to real name.funscript) + video link <h1>
    
    <div class="napomena">
        <strong>Important Notice:</strong> Once you upload your .txt files, they will be automatically renamed to their original, full product names with the proper .funscript extension for download.
    </div>

    <div class="okvir-za-izbor" onclick="document.getElementById('file-upload').click()">
        <button class="gumb-izaberi">Select .txt Files</button>
        <input type="file" id="file-upload" multiple accept=".txt">
        <div id="poruka-baza">Connecting to the database...</div>
    </div>

    <div id="lista-za-skidanje"></div>
</div>

<script>
    const bazaUrl = "./baza.json?t=" + new Date().getTime();
    let popisBaza = {};

    async function ucitajPopis() {
        try {
            const response = await fetch(bazaUrl);
            if (!response.ok) throw new Error("Network issue");
            const podaci = await response.json();

            for (let kljuc in podaci) {
                popisBaza[kljuc.toUpperCase().trim()] = {
                    ime: podaci[kljuc].ime ? podaci[kljuc].ime.trim() : "",
                    video: podaci[kljuc].video ? podaci[kljuc].video.trim() : ""
                };
            }
            
            document.getElementById('poruka-baza').innerText = "Database loaded successfully. Ready to convert.";
            document.getElementById('poruka-baza').style.color = "#24a148";
        } catch (error) {
            console.error(error);
            document.getElementById('poruka-baza').innerHTML = "<span style='color:#f85149;'>Error loading database! Please refresh the page.</span>";
        }
    }

    ucitajPopis();

    document.getElementById('file-upload').addEventListener('change', async function(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        const listaDiv = document.getElementById('lista-za-skidanje');
        listaDiv.innerHTML = '';

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const staroImeSaEkstenzijom = file.name;
            const staroIme = staroImeSaEkstenzijom.substring(0, staroImeSaEkstenzijom.lastIndexOf('.')) || staroImeSaEkstenzijom;
            
            const kljuc = staroIme.toUpperCase().trim();
            const stavkaDiv = document.createElement('div');
            stavkaDiv.className = "stavka";

            if (popisBaza[kljuc]) {
                const podaciSkripte = popisBaza[kljuc];
                const samoIme = podaciSkripte.ime;
                const videoLink = podaciSkripte.video;
                
                const novoIme = samoIme + ".funscript";
                const tekst = await procitajDatotekuKaoTekst(file);
                
                const blob = new Blob([tekst], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                let htmlSadrzaj = `
                    <div class="ime-skripte"><strong>${staroImeSaEkstenzijom}</strong> &rarr; <span style="color: #fff; font-weight: 500;">${novoIme}</span></div>
                    <div class="gumbi-kontejner">
                        <a href="${url}" download="${novoIme}" class="gumb-skini">Download</a>
                `;

                if (videoLink && videoLink !== "" && !videoLink.includes("Ovdje_zalijepi")) {
                    htmlSadrzaj += `<a href="${videoLink}" target="_blank" class="gumb-video">📺 Downloading video</a>`;
                }

                htmlSadrzaj += `</div>`;
                stavkaDiv.innerHTML = htmlSadrzaj;

            } else {
                stavkaDiv.className = "stavka greska";
                stavkaDiv.innerHTML = `
                    <div class="ime-skripte" style="color: #6e6e73;">${staroImeSaEkstenzijom}</div>
                    <div class="greska-tekst">X Code '${kljuc}' not found</div>
                `;
            }

            listaDiv.appendChild(stavkaDiv);
        }
    });

    function procitajDatotekuKaoTekst(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = e => reject(e);
            reader.readAsText(file);
        });
    }
</script>

</body>
</html>
