<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funscript Extractor & Renamer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 600px; background: white; padding: 30px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 15px; margin-bottom: 25px; }
        .step-box { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .step-title { font-weight: bold; color: #2c3e50; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .file-input { margin: 10px 0; padding: 10px; border: 2px dashed #3498db; border-radius: 5px; background: #fff; cursor: pointer; display: block; width: 100%; box-sizing: border-box; font-size: 14px; }
        button { background-color: #2ecc71; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        #status { margin-top: 20px; font-weight: bold; color: #2980b9; font-size: 16px; text-align: center; }
        .output-section { text-align: left; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        h3 { color: #2c3e50; margin-top: 15px; margin-bottom: 10px; }
        .list-container { text-align: left; margin-top: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 12px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #eee; }
        .item-name { font-size: 14px; word-break: break-all; padding-right: 10px; }
        .download-btn { background-color: #3498db; color: white; border: none; width: auto; font-size: 14px; padding: 6px 15px; margin: 0; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .download-btn:hover { background-color: #2980b9; }
        .skupno-btn { background-color: #e67e22; margin-bottom: 15px; }
        .skupno-btn:hover { background-color: #d35400; }
        hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Funscript Renamer</h1>
    <p>Extract and rename your .funscript files instantly. Select your ZIP files and click process!</p>
    
    <div class="step-box">
        <div class="step-title">1️⃣ Database Status</div>
        <div id="dbStatus" style="color: #2ecc71; font-weight: bold;">✅ Connected! Internal database loaded.</div>
    </div>

    <div class="step-box">
        <div class="step-title">2️⃣ Step 2: Select Your ZIP Files</div>
        <input type="file" id="zipFiles" class="file-input" multiple accept=".zip">
    </div>
    
    <button id="processBtn">Start Processing Files</button>
    
    <div id="status">⚡ System ready. Please select your ZIP files in Step 2.</div>
    <div id="outputArea" class="output-section" style="display:none;"></div>
</div>

<script>
const mapaImenaRaw = {
  "hsf01": "Massage Rooms Busty masseuse Rita tender loving care",
  "hsf02": "Sexy Twins Double The Pleasure For Mr. Big - Matilda Bae - EPORNER",
  "hsf03": "Czech Tantra Couple Ritual feat. Belle Claire",
  "hsf04": "Making Daddy Cum My Mouth POV feat. Innocenttemptation",
  "hsf74": "Sybil jerking your cock with deep eye contact TeasingAngels",
  "hsf75": "Aqua Ri Mc Mommy",
  "hsf76": "Straplezz - Romance in silky black pantyhose HeavyFetish",
  "hsf77": "Asian Leather Gloves Handjob Deepthroat Facial",
  "hsf78": "The last time I masturbated you CLUBTUG",
  "hsf80": "Ripped my jeans and fucked me hard. How am I supposed to go home ImMayBee"
};

const mapaImena = {};
for (let i = 1; i <= 100; i++) {
    let kljuc = "hsf" + String(i).padStart(2, '0');
    if (mapaImenaRaw[kljuc]) {
        mapaImena[kljuc] = mapaImenaRaw[kljuc];
    } else {
        mapaImena[kljuc] = "Funscript Script Number " + i;
    }
}

document.getElementById('dbStatus').innerHTML = `✅ Connected! Loaded ${Object.keys(mapaImenaRaw).length} custom scripts.`;

function preuzmiBlob(blob, nazivDatoteke) {
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = nazivDatoteke;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
    }, 100);
}

document.getElementById('processBtn').addEventListener('click', async () => {
    const files = document.getElementById('zipFiles').files;
    const outputArea = document.getElementById('outputArea');
    const statusDiv = document.getElementById('status');

    if (files.length === 0) {
        alert("Please select at least one ZIP file in Step 2.");
        return;
    }
    
    statusDiv.innerHTML = "Processing files, please wait...";
    outputArea.innerHTML = "";
    outputArea.style.display = "none";
    
    let rezultati = [];
    let finalniZip = new JSZip();
    let brojacUspjesnih = 0;

    for (let file of files) {
        const staroImeZipa = file.name;
        const imeBezEkstenzije = staroImeZipa.substring(0, staroImeZipa.lastIndexOf('.')).trim().toLowerCase();
        
        if (mapaImena[imeBezEkstenzije]) {
            let novoImeBaza = mapaImena[imeBezEkstenzije];
            novoImeBaza = novoImeBaza.replace(/[<>:"/\\|?*]/g, "");
            
            try {
                const zipSadrzaj = await JSZip.loadAsync(file);
                let funscriptPodaci = null;
                
                for (let filename in zipSadrzaj.files) {
                    if (filename.toLowerCase().endsWith('.funscript')) {
                        funscriptPodaci = await zipSadrzaj.files[filename].async("blob");
                        break;
                    }
                }
                
                if (funscriptPodaci) {
                    brojacUspjesnih++;
                    const puniNazivFunscripta = novoImeBaza + ".funscript";
                    
                    rezultati.push({
                        ime: puniNazivFunscripta,
                        blob: funscriptPodaci
                    });
                    
                    finalniZip.file(puniNazivFunscripta, funscriptPodaci);
                }
            } catch (e) {
                console.error("Error reading ZIP file: " + staroImeZipa, e);
            }
        }
    }
    
    if (brojacUspjesnih > 0) {
        statusDiv.innerHTML = `<span style='color: #2ecc71;'>✅ Successfully processed ${brojacUspjesnih} file(s)!</span>`;
        outputArea.style.display = "block";
        
        if (rezultati.length > 1) {
            outputArea.innerHTML += `<h3>📦 Bulk Download</h3>`;
            const skupniGumb = document.createElement('button');
            skupniGumb.className = "skupno-btn";
            skupniGumb.innerText = "⚡ Download ALL at once (.ZIP package)";
            skupniGumb.onclick = async () => {
                const content = await finalniZip.generateAsync({type:"blob"});
                preuzmiBlob(content, "all_scripts.zip");
            };
            outputArea.appendChild(skupniGumb);
            outputArea.innerHTML += `<hr>`;
        }
        
        outputArea.innerHTML += `<h3>📄 Individual Downloads</h3>`;
        const listDiv = document.createElement('div');
        listDiv.className = "list-container";
        
        rezultati.forEach(stavka => {
            const row = document.createElement('div');
            row.className = "item-row";
            
            const tekstSpan = document.createElement('span');
            tekstSpan.className = 'item-name';
            tekstSpan.innerHTML = `🔹 <strong>${stavka.ime}</strong>`;
            
            const gumbZaPreuzimanje = document.createElement('button');
            gumbZaPreuzimanje.className = 'download-btn';
            gumbZaPreuzimanje.innerText = 'Download';
            gumbZaPreuzimanje.onclick = () => {
                preuzmiBlob(stavka.blob, stavka.ime);
            };
            
            row.appendChild(tekstSpan);
            row.appendChild(gumbZaPreuzimanje);
            listDiv.appendChild(row);
        });
        
        outputArea.appendChild(listDiv);
    } else {
        statusDiv.innerHTML = "<span style='color: #e74c3c;'>❌ No matching file names found in the database.</span>";
    }
});
</script>
</body>
</html>
