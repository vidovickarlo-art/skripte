<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funscript Extractor & Renamer</title>
    <!-- Ispravno i točno povezivanje s tvojim ZIP motorom -->
    <script src="jszip.js"></script>
</head>
<body>

<script>
// TVOJA BAZA PODATAKA
const mapaImenaRaw = {
  "hsf01": "Massage Rooms Busty masseuse Rita tender loving care",
  "hsf02": "Sexy Twins Double The Pleasure For Mr. Big - Matilda Bae - EPORNER",
  "hsf03": "Czech Tantra Couple Ritual feat. Belle Claire",
  "hsf04": "Making Daddy Cum My Mouth POV feat. Innocenttemptation",
  "hsf74": "Sybil jerking your cock with deep eye contact TeasingAngels",
  "hsf75": "Aqua Ri Mc Mommy",
  "hsf76": "Straplezz - Romance in silky black pantyhose HeavyFetish",
  "hsf77": "Asian Leather Gloves Handjob Deepthroat Facial",
  "hsf78": "The last time I masturbated you CLUBTUG",
  "hsf80": "Ripped my jeans and fucked me hard. How am I supposed to go home ImMayBee"
};

const mapaImena = {};
for (let i = 1; i <= 100; i++) {
    let kljuc = "hsf" + String(i).padStart(2, '0');
    if (mapaImenaRaw[kljuc]) {
        mapaImena[kljuc] = mapaImenaRaw[kljuc];
    } else {
        mapaImena[kljuc] = "Funscript Script Number " + i;
    }
}

document.addEventListener("DOMContentLoaded", () => {
    document.body.innerHTML = `
        <div style="max-width: 600px; margin: 40px auto; font-family: Arial, sans-serif; text-align: center; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); color: #333;">
            <h2>📝 Funscript Renamer</h2>
            <p style="color: #7f8c8d;">Extract and rename your .funscript files instantly.</p>
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px; border: 1px solid #e9ecef;">
                <strong>1️⃣ Database Status:</strong> <span id="dbStatus" style="color: #2ecc71; font-weight: bold;">✅ Connected!</span>
            </div>
            <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px; border: 1px solid #e9ecef;">
                <strong>2️⃣ Select ZIP Files:</strong>
                <input type="file" id="zipFiles" multiple accept=".zip" style="display: block; margin-top: 10px; width: 100%; box-sizing: border-box; padding: 10px; border: 2px dashed #3498db; background: #fff; border-radius: 5px; cursor: pointer;">
            </div>
            <button id="processBtn" style="background: #2ecc71; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer;">Start Processing Files</button>
            <div id="status" style="margin-top: 20px; font-weight: bold; color: #2980b9;">⚡ System ready.</div>
            <div id="outputArea" style="margin-top: 20px; display: none; text-align: left; border-top: 2px solid #eee; padding-top: 20px;"></div>
        </div>
    `;

    document.getElementById('dbStatus').innerHTML = `✅ Connected! Loaded ${Object.keys(mapaImenaRaw).length} custom scripts.`;

    function preuzmiBlob(blob, nazivDatoteke) {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = nazivDatoteke;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }, 100);
    }

    document.getElementById('processBtn').addEventListener('click', async () => {
        const files = document.getElementById('zipFiles').files;
        const outputArea = document.getElementById('outputArea');
        const statusDiv = document.getElementById('status');

        if (files.length === 0) {
            alert("Please select at least one ZIP file.");
            return;
        }

        statusDiv.innerHTML = "Processing files, please wait...";
        outputArea.innerHTML = "";
        outputArea.style.display = "none";

        let rezultati = [];
        let finalniZip = new JSZip();
        let brojacUspjesnih = 0;

        for (let file of files) {
            const staroImeZipa = file.name;
            const imeBezEkstenzije = staroImeZipa.substring(0, staroImeZipa.lastIndexOf('.')).trim().toLowerCase();

            if (mapaImena[imeBezEkstenzije]) {
                let novoImeBaza = mapaImena[imeBezEkstenzije].replace(/[<>:"/\\|?*]/g, "");

                try {
                    const zipSadrzaj = await JSZip.loadAsync(file);
                    let funscriptPodaci = null;

                    for (let filename in zipSadrzaj.files) {
                        if (filename.toLowerCase().endsWith('.funscript')) {
                            funscriptPodaci = await zipSadrzaj.files[filename].async("blob");
                            break;
                        }
                    }

                    if (funscriptPodaci) {
                        brojacUspjesnih++;
                        const puniNazivFunscripta = novoImeBaza + ".funscript";
                        rezultati.push({ ime: puniNazivFunscripta, blob: funscriptPodaci });
                        finalniZip.file(puniNazivFunscripta, funscriptPodaci);
                    }
                } catch (e) {
                    console.error("Greška pri čitanju ZIP-a: ", e);
                }
            }
        }

        if (brojacUspjesnih > 0) {
            statusDiv.innerHTML = "<span style='color: #2ecc71;'>✅ Successfully processed!</span>";
            outputArea.style.display = "block";

            if (rezultati.length > 1) {
                const skupniGumb = document.createElement('button');
                skupniGumb.style.cssText = "background: #e67e22; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 5px; margin-bottom: 15px; cursor: pointer; font-size: 14px;";
                skupniGumb.innerText = "⚡ Download ALL at once (.ZIP package)";
                skupniGumb.onclick = async () => {
                    const content = await finalniZip.generateAsync({ type: "blob" });
                    preuzmiBlob(content, "all_scripts.zip");
                };
                outputArea.appendChild(skupniGumb);
            }

            rezultati.forEach(stavka => {
                const row = document.createElement('div');
                row.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 12px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #eee;";
                row.innerHTML = `<span style="font-size: 14px; word-break: break-all; padding-right: 10px;">🔹 <strong>${stavka.ime}</strong></span>`;

                const gumb = document.createElement('button');
                gumb.style.cssText = "background: #3498db; color: white; border: none; padding: 6px 15px; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 14px;";
                gumb.innerText = "Download";
                gumb.onclick = () => preuzmiBlob(stavka.blob, stavka.ime);

                row.appendChild(gumb);
                outputArea.appendChild(row);
            });
        } else {
            statusDiv.innerHTML = "<span style='color: #e74c3c;'>❌ No matching file names found in the database.</span>";
        }
    });
});
</script>
</body>
</html>
